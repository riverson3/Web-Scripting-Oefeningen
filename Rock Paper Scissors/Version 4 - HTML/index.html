<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock, paper, scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button class="move-button" onclick="play('rock')">Rock</button>
    <button class="move-button" onclick="play('paper')">Paper</button>
    <button class="move-button" onclick="play('scissors')">Scissors</button>

    <p class="js-result"></p>
    <p class="js-moves-chosen"></p>
    <p class="js-score"></p>

    <button class="reset-score-button" onclick="reset()">reset score</button>

    <script src="rockPaperScissors.js"></script>
</body>
</html>
